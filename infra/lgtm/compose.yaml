x-capture: &capture
  image: ${PLOW_CAPTURE_IMAGE:-plow-capture:local}
  build:
    context: ../..
    dockerfile: infra/lgtm/grafana.Dockerfile
    target: capture
  restart: ${PLOW_LGTM_RESTART:-no}

x-codex-capture: &codex-capture
  <<: *capture
  profiles: [capture-codex]
  environment:
    PLOW_CAPTURE_SCOPE: ${PLOW_CODEX_SCOPE:-}
    PLOW_CAPTURE_STATE: /state
    PLOW_CAPTURE_SPOOL: /spool
    PLOW_CODEX_ROOTS: /input/sessions:/input/archives
  volumes:
    - ${PLOW_LGTM_WORKDIR:?Set a private fixture work directory}/spool:/spool
    - capture-state:/state
    - ${PLOW_CODEX_SESSIONS:-/dev/null}:/input/sessions:ro
    - ${PLOW_CODEX_ARCHIVES:-/dev/null}:/input/archives:ro

x-t3-capture: &t3-capture
  <<: *capture
  profiles: [capture-t3]
  network_mode: ${PLOW_T3_NETWORK_MODE:-bridge}
  environment:
    PLOW_CAPTURE_SCOPE: ${PLOW_T3_SCOPE:-}
    PLOW_CAPTURE_STATE: /state
    PLOW_CAPTURE_SPOOL: /spool
    PLOW_T3_ORIGIN: ${PLOW_T3_ORIGIN:-}
    PLOW_T3_READ_TOKEN_FILE: /run/plow-t3-bearer
  volumes:
    - ${PLOW_LGTM_WORKDIR:?Set a private fixture work directory}/spool:/spool
    - capture-state:/state
    - ${PLOW_T3_READ_TOKEN_FILE:-/dev/null}:/run/plow-t3-bearer:ro

services:
  grafana:
    image: ${PLOW_GRAFANA_IMAGE:-plow-grafana-greenfield:local}
    build:
      context: ../..
      dockerfile: infra/lgtm/grafana.Dockerfile
    ports:
      - target: 3000
        published: "${PLOW_GRAFANA_PORT:-0}"
        host_ip: 127.0.0.1
    restart: ${PLOW_LGTM_RESTART:-no}
    environment:
      GF_SERVER_ROOT_URL: ${PLOW_GRAFANA_ROOT_URL:-http://localhost:3000/}
      GF_AUTH_PROXY_ENABLED: ${PLOW_GRAFANA_TAILNET_AUTH:-false}
      GF_AUTH_PROXY_HEADER_NAME: Tailscale-User-Login
      GF_AUTH_PROXY_AUTO_SIGN_UP: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED: "true"
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: plow-agent-observability-datasource
    secrets:
      - grafana_password
    volumes:
      - grafana-data:/var/lib/grafana
      - ../../grafana/provisioning:/etc/grafana/provisioning:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 3s
      timeout: 2s
      retries: 20
  loki:
    restart: ${PLOW_LGTM_RESTART:-no}
    image: grafana/loki:3.6.2@sha256:fad94db64eeb0e14544953789c942453df68a860b6f760d867f06c5b31f461ab
    command: ["-config.file=/etc/loki/plow.yaml"]
    ports:
      - target: 3100
        host_ip: 127.0.0.1
    volumes:
      - ./loki.yaml:/etc/loki/plow.yaml:ro
      - loki-data:/loki
  tempo:
    restart: ${PLOW_LGTM_RESTART:-no}
    image: grafana/tempo:2.10.2@sha256:b6ade23a821c6bdb89487130dee39bd7bf6595e9fc521212ecb7878feb934d72
    command: ["-config.file=/etc/tempo/plow.yaml"]
    ports:
      - target: 3200
        host_ip: 127.0.0.1
    volumes:
      - ./tempo.yaml:/etc/tempo/plow.yaml:ro
      - tempo-data:/var/tempo
  mimir:
    restart: ${PLOW_LGTM_RESTART:-no}
    image: grafana/mimir:3.0.0@sha256:dfa02581c519a28e2ce50c7304d05a635bb1e14b36e2f8a7a54815b36d4d1f9b
    command: ["-config.file=/etc/mimir/plow.yaml"]
    ports:
      - target: 9009
        host_ip: 127.0.0.1
    volumes:
      - ./mimir.yaml:/etc/mimir/plow.yaml:ro
      - mimir-data:/data
  alloy:
    restart: ${PLOW_LGTM_RESTART:-no}
    image: grafana/alloy:v1.22.0@sha256:9acc2529bc1edb7f5b2bd801dd8334ebc80c158e3a9e5526ecd7c9a273d43189
    command: ["run", "--stability.level=public-preview", "--storage.path=/var/lib/alloy", "--disable-reporting", "/etc/alloy/config.alloy"]
    depends_on:
      - loki
      - tempo
      - mimir
    ports:
      - target: 4318
        published: "${PLOW_TEMPO_ALLOY_PORT:-0}"
        host_ip: 127.0.0.1
    volumes:
      - ../../collect/alloy/config.txt:/etc/alloy/config.alloy:ro
      - ../../collect/alloy/collection-health.txt:/etc/alloy/collection-health.alloy:ro
      - ${PLOW_LGTM_WORKDIR:?Set a private fixture work directory}/spool:/spool:ro
      - alloy-data:/var/lib/alloy
  codex-live:
    <<: *codex-capture
    command: ["node", "collect/fixture.ts", "--capture", "live"]
  codex-backfill:
    <<: *codex-capture
    command: ["node", "collect/fixture.ts", "--capture", "backfill"]
  t3-live:
    <<: *t3-capture
    command: ["node", "collect/t3/read.ts", "--capture", "live"]
  t3-backfill:
    <<: *t3-capture
    command: ["node", "collect/t3/read.ts", "--capture", "backfill"]

secrets:
  grafana_password:
    file: ${PLOW_LGTM_WORKDIR:?Set a private fixture work directory}/grafana-password
volumes:
  grafana-data:
  loki-data:
  alloy-data:
  capture-state:
  tempo-data:
  mimir-data:
